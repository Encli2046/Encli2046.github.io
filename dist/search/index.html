;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2017&quot;],[0,&quot;区块链&quot;],[0,&quot;加密货币&quot;],[0,&quot;以太坊&quot;],[0,&quot;比特币&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Bitcoin reaches $10,000 for the first time&quot;],&quot;url&quot;:[0,&quot;https://www.cnbc.com/2017/11/28/bitcoin-hits-10000-for-the-first-time.html&quot;],&quot;publisher&quot;:[0,&quot;CNBC&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Ethereum Enterprise Alliance launches&quot;],&quot;url&quot;:[0,&quot;https://entethalliance.org/eea-launches/&quot;],&quot;publisher&quot;:[0,&quot;Enterprise Ethereum Alliance&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;State of Blockchain 2017&quot;],&quot;url&quot;:[0,&quot;https://www.coindesk.com/learn/state-of-blockchain-2017&quot;],&quot;publisher&quot;:[0,&quot;CoinDesk&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2017 年，区块链从一个密码学极客圈的技术实验，变成了全球金融和科技行业无法忽视的话题。这一年，比特币价格从年初约 1000 美元涨至年末近 20000 美元，以太坊则通过智能合约打开了去中心化应用的想象空间。\n\n## 比特币：从边缘到主流金融视野\n\n2017 年 11 月 28 日，比特币价格首次突破 10000 美元，随后在 12 月触及接近 20000 美元的历史最高点。这一过程吸引了全球媒体的密集报道。\n\n价格上涨只是表面信号，更关键的变化发生在基础设施层面：芝加哥商品交易所（CME）宣布推出比特币期货，Coinbase 用户量在这一年爆发增长，多个国家开始讨论加密货币的监管框架。\n\n**观点判断：** 2017 年比特币的价格表现更多反映的是市场对去中心化资产的投机需求，而非区块链技术的成熟度。但这次出圈让大量开发者、资本和机构开始认真研究底层技术，客观上加速了后续几年的技术发展。\n\n## 以太坊和智能合约的生态起步\n\n2017 年，以太坊的 ERC-20 代币标准成为 ICO（Initial Coin Offering）的技术基础。数百个项目通过以太坊发行代币，虽然其中大量项目后来被证明不可持续，但智能合约的编程范式和去中心化应用的可行性在这一年被大规模验证。\n\n以太坊企业联盟（Enterprise Ethereum Alliance）也在 2017 年成立，首批成员包括微软、摩根大通、英特尔等大型企业，表明联盟链和许可链的方向也在同步发展。\n\n## 对技术从业者的影响\n\n2017 年区块链热潮给技术圈带来的直接影响包括：\n\n- 区块链开发者需求激增，Solidity 和智能合约审计成为新的技能方向\n- 去中心化理念开始渗透到身份认证、数据存储、供应链等领域\n- 共识机制、密码学、分布式系统的研究和工程投入显著增加\n- Web3 的概念在这一年开始成型\n\n**观点判断：** 2017 年是区块链行业的技术分水岭。之前的区块链主要由比特币社区驱动，之后则出现了更丰富的技术生态：以太坊、联盟链、跨链、Layer 2 等方向都在这一年的喧嚣中埋下了种子。看待区块链最好的方式不是盯着币价，而是观察底层技术如何逐步被工程化验证。\n\n## 小结\n\n2017 年区块链从极客圈走向了大众视野。虽然其间充斥着投机和泡沫，但不可否认的是，分布式账本、智能合约和去中心化共识这些技术概念，在这一年进入了全球技术从业者的日常讨论。对工程师来说，该做的不是 FOMO，而是理解技术本质，区分信号与噪声。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2017-first-line-code&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;从第一行代码开始：我的技术启蒙笔记&quot;],&quot;description&quot;:[0,&quot;回忆刚开始接触编程时的笨拙、兴奋和一点点坚持。&quot;],&quot;date&quot;:[3,&quot;2017-03-12T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2017-first-line-code.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2017&quot;],[0,&quot;技术成长&quot;],[0,&quot;编程入门&quot;],[0,&quot;个人记录&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;刚开始写代码的时候，其实没有想过以后要靠它做什么。那时更多是一种很单纯的好奇：为什么在一个黑色窗口里敲几行字，屏幕上就会出现另一个结果。这个过程看起来有点神奇，也有点不讲道理。\n\n![第一行代码](/images/posts/personal-growth/2017-first-line-code.jpg)\n\n我记得最早接触的是一些很基础的页面和脚本。照着教程写，文件名经常保存错，路径也经常找不到。一个分号、一个括号、一个大小写，都可能让我卡上半个晚上。那时候我并不懂什么工程化，也不知道什么设计模式，只知道报错了就一行一行看，实在看不出来就从头再敲一遍。\n\n现在回头看，那段时间最重要的收获不是学会了某个语法，而是第一次体会到“问题可以被拆开”。一个看起来完全无法理解的错误，只要愿意慢慢找，总能找到线索。它可能在控制台，也可能在文件路径里，也可能只是自己少看了一行提示。\n\n那时的学习效率并不高。很多概念今天看明白了，第二天又忘了。做出来的东西也很粗糙，页面排版歪歪扭扭，交互只能算勉强能用。但每一次刷新页面看到变化，都有一种很实在的满足感。\n\n后来我才意识到，技术启蒙不一定来自宏大的目标，很多时候只是来自一次小小的成功：按钮真的被点到了，文字真的变色了，数据真的显示出来了。它们不起眼，却足够把一个人往前推一点。\n\n2017 年对我来说，就是这样开始的。没有特别漂亮的开场，也没有清晰的路线图，只是在一台普通电脑前，笨拙地敲下第一行代码，然后慢慢知道，原来自己可以和机器讲一点点道理。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2017-frontend-engineering&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2017 年前端工程化观察&quot;],&quot;description&quot;:[0,&quot;以 React 16 重写、WebAssembly MVP 共识和 Node.js 生产化为线索，回顾 2017 年前端工程从工具成熟走向系统稳定的一年。&quot;],&quot;date&quot;:[3,&quot;2017-12-31T00:00:00.000Z&quot;],&quot;categories&quot;:[1,[[0,&quot;others&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2017&quot;],[0,&quot;前端&quot;],[0,&quot;React&quot;],[0,&quot;WebAssembly&quot;],[0,&quot;Node.js&quot;]]],&quot;category&quot;:[0,&quot;技术观察&quot;],&quot;updated&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;React 16: A look inside an API-compatible rewrite of our frontend UI library&quot;],&quot;url&quot;:[0,&quot;https://engineering.fb.com/2017/09/26/web/react-16-a-look-inside-an-api-compatible-rewrite-of-our-frontend-ui-library/&quot;],&quot;publisher&quot;:[0,&quot;Engineering at Meta&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;WebAssembly consensus and end of Browser Preview&quot;],&quot;url&quot;:[0,&quot;https://lists.w3.org/Archives/Public/public-webassembly/2017Feb/0002.html&quot;],&quot;publisher&quot;:[0,&quot;W3C public-webassembly mailing list&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Node.js 8.0.0 (Current)&quot;],&quot;url&quot;:[0,&quot;https://nodejs.org/en/blog/release/v8.0.0&quot;],&quot;publisher&quot;:[0,&quot;Node.js Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Production Ready Node.js 8.9.0&quot;],&quot;url&quot;:[0,&quot;https://www.linuxfoundation.org/press/press-release/production-ready-node-js-8-9-0-brings-elegant-coding-20-performance-boost-web-applications&quot;],&quot;publisher&quot;:[0,&quot;Linux Foundation&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;GitHub Octoverse 2017&quot;],&quot;url&quot;:[0,&quot;https://octoverse.github.com/2017/&quot;],&quot;publisher&quot;:[0,&quot;GitHub Octoverse&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2017 年的前端，表面上没有出现一个像 React 发布或 ES6 标准落地那样的大爆点。但如果把几个方向放在一起看，这一年其实是前端工程化真正沉淀下来的一年。\n\n## React 不只是更新，是一次重构\n\nReact 16 在 2017 年 9 月发布。Meta 工程博客把它描述为\&quot;保持 API 兼容的内部重写\&quot;，核心改动是 Fiber——一套新的协调引擎，重新设计了组件树的更新和调度方式。\n\n这件事的意义不在于新 API，而在于它的方向：前端框架开始关注运行时质量。异步渲染、错误边界、调度优先级——这些以往只属于系统编程的词汇，被前端框架认真对待了。\n\nReact 通过这次重写证明了大型 UI 库可以做到不破坏 API 而升级内部实现。对依赖它的团队来说，这意味着工程债可以控制在可接受范围，框架不是消费品，而是可长期信赖的依赖项。\n\n## WebAssembly 打开 Web 的另一个入口\n\n2017 年 2 月，四大浏览器厂商在 W3C 邮件列表中达成 WebAssembly MVP 共识。这不只是一项新标准的起步，它改变了 Web 作为计算平台的底层想象。\n\nWebAssembly 没有替代 JavaScript，但它让浏览器有能力承载更多对性能敏感的工作负载——图形处理、音视频编解码、科学计算、跨语言运行时。Web 不再只是一张页面，它在变成更严肃的软件运行环境。\n\n**观点判断：** WebAssembly 的长期影响可能会比 React 16 更大，因为它在 Web 平台底层打开了一条新路，而这条路的影响周期是用十年计算的。\n\n## Node.js 进入生产节奏\n\n2017 年 5 月 Node.js 8.0.0 发布，同年 10 月进入 LTS。Node.js 基金会特别强调了这个版本在 Web 应用场景中的性能提升。\n\nLTS 节奏的意义很实际：企业团队可以围绕稳定运行时制定升级策略，而不是在每次小版本发布后匆忙跟进。Node.js 走完了一个技术从实验到生产依赖的完整路径。\n\nGitHub Octoverse 2017 的数据也印证了这一点：JavaScript 在 GitHub 337 种语言中保持极高的活跃度，Python 超过 Java 成为第二。这两个动态放在一起看，Web 工程和 AI/数据科学两条线在开源社区的并行增长已经清晰可见。\n\n## 小结\n\n2017 年的前端工程化，重点不是某个框架赢了，而是整个领域的工程标准在提高。框架的内部架构越来越认真，Web 平台底层能力继续扩展，JavaScript 运行时变得可依赖，开源社区的规模也提供了足够的反馈信号。\n\n这几个方向在 2017 年各自推进了一小步，但它们合在一起，构成了前端工程从工具驱动走向系统驱动的转折点。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2017-infrastructure-signals&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2017：基础设施进入稳定周期&quot;],&quot;description&quot;:[0,&quot;从 TensorFlow、WebAssembly、Node.js、Kubernetes 和移动平台变化中，观察 2017 年技术基础设施的成熟信号。&quot;],&quot;date&quot;:[3,&quot;2017-12-31T00:00:00.000Z&quot;],&quot;categories&quot;:[1,[[0,&quot;others&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2017&quot;],[0,&quot;基础设施&quot;],[0,&quot;WebAssembly&quot;],[0,&quot;Node.js&quot;],[0,&quot;Kubernetes&quot;],[0,&quot;TensorFlow&quot;]]],&quot;category&quot;:[0,&quot;技术观察&quot;],&quot;updated&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Announcing TensorFlow 1.0&quot;],&quot;url&quot;:[0,&quot;https://opensource.googleblog.com/2017/02/announcing-tensorflow-10.html&quot;],&quot;publisher&quot;:[0,&quot;Google Open Source Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;WebAssembly consensus and end of Browser Preview&quot;],&quot;url&quot;:[0,&quot;https://lists.w3.org/Archives/Public/public-webassembly/2017Feb/0002.html&quot;],&quot;publisher&quot;:[0,&quot;W3C public-webassembly mailing list&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Node.js 8.0.0 (Current)&quot;],&quot;url&quot;:[0,&quot;https://nodejs.org/en/blog/release/v8.0.0&quot;],&quot;publisher&quot;:[0,&quot;Node.js Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Kubernetes 1.8: Security, Workloads and Feature Depth&quot;],&quot;url&quot;:[0,&quot;https://kubernetes.io/blog/2017/09/kubernetes-18-security-workloads-and/&quot;],&quot;publisher&quot;:[0,&quot;Kubernetes Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Introducing Android 8.0 Oreo&quot;],&quot;url&quot;:[0,&quot;https://android-developers.googleblog.com/2017/08/introducing-android-8-oreo.html&quot;],&quot;publisher&quot;:[0,&quot;Android Developers Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-11T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;如果只看单个发布，2017 年像是很多技术各自前进了一步。但把这些事件放在一起看，会发现一个更清晰的趋势：基础设施正在从“可用”走向“稳定”。\n\n这种稳定不是停滞，而是进入生产系统所需要的稳定。API 要更可靠，运行时要有节奏，平台要能被团队长期维护。\n\n## 机器学习开始强调工程边界\n\nTensorFlow 1.0 的意义不只在于版本号。Google 在发布中强调 Python API 稳定性，这说明机器学习框架已经不再只是研究者快速实验的工具，也开始面对团队协作和生产部署。\n\n框架能否长期被依赖，取决于它是不是能让开发者少担心破坏性变化。稳定 API 是工程化的入口。\n\n## Web 获得更低层的能力\n\nWebAssembly 在 2017 年形成 MVP 共识，让浏览器拥有了一个新的低层执行目标。它没有替代 JavaScript，而是扩展了 Web 的边界。\n\n这让更多对性能敏感、跨语言、跨平台的场景有机会进入浏览器。Web 不再只是一层页面技术，也逐渐成为可承载复杂软件的运行环境。\n\n## JavaScript 运行时走向生产节奏\n\nNode.js 8 的发布和后续 LTS 节奏，说明服务端 JavaScript 的稳定性越来越重要。对团队来说，运行时不是追新的玩具，而是部署、升级和维护策略的一部分。\n\n一个技术进入生产环境以后，真正重要的往往不是“它能做什么”，而是“它如何长期不出问题”。\n\n## 云原生开始关注深度能力\n\nKubernetes 1.8 把安全、工作负载和功能深度放在显眼位置。这个方向很关键：容器编排只是入口，真正的生产平台需要权限、安全、调度、生命周期管理和可运维性。\n\n从这一点看，Kubernetes 的主线并不是更酷的容器，而是更可靠的平台抽象。\n\n## 移动平台继续约束应用行为\n\nAndroid 8.0 Oreo 对后台执行等系统行为提出更明确的限制。移动平台越成熟，就越会主动约束应用，保护续航、性能和用户体验。\n\n这种变化让开发者必须接受一个事实：平台不是无限资源池，应用需要在规则内运行。\n\n## 小结\n\n2017 年的关键线索不是某一个技术赢了，而是很多技术开始进入“可长期依赖”的阶段。\n\n从机器学习到 Web，从 Node.js 到 Kubernetes，再到移动平台，成熟的标志都差不多：稳定接口、清晰边界、可维护节奏，以及对生产环境的尊重。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2017-old-computer-night-project&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;旧电脑、深夜和一个没有上线的小项目&quot;],&quot;description&quot;:[0,&quot;记录一个没有真正上线的小项目，以及它留下的实际经验。&quot;],&quot;date&quot;:[3,&quot;2017-10-28T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2017-old-computer-night-project.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;项目复盘&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2017&quot;],[0,&quot;项目复盘&quot;],[0,&quot;个人项目&quot;],[0,&quot;随笔&quot;]]],&quot;category&quot;:[0,&quot;项目复盘&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2017 年做过一个小项目，现在已经记不清它原本想解决什么问题了。只记得那段时间经常在晚上打开电脑，想着“今晚一定推进一点”，然后在各种小问题里慢慢消耗掉两个小时。\n\n![没上线的小项目](/images/posts/personal-growth/2017-old-computer-night-project.jpg)\n\n那台电脑并不快，打开编辑器和浏览器都会有一点迟钝。项目目录里有很多试验留下的文件，命名也不统一。有些页面做了一半，有些函数写了又删，最后整个项目像一张没有整理过的书桌。它没有上线，也没有给任何人正式使用过。\n\n以前我会觉得这种项目很失败，因为没有结果。后来再看，它其实很像一次练习。真正让我进步的，不是最后有没有发布，而是在过程中第一次遇到“完整项目”的混乱：页面之间怎么组织，数据放在哪里，样式怎么不互相影响，改一个地方为什么会坏另一个地方。\n\n那些问题在教程里通常不会一起出现。教程总是干净的，项目却会慢慢变乱。一个人写的时候尤其明显，因为没有人提醒你该整理目录，也没有人帮你做取舍。\n\n这个没有上线的小项目让我明白，写代码不是把功能堆出来就结束了。它还包括命名、整理、删除、记录，以及在自己头脑发热的时候停下来想一想：这个功能真的需要吗？这个文件以后还能看懂吗？\n\n虽然它最后只是安静地躺在硬盘里，但我并不觉得可惜。很多早期项目的价值就是这样，它们没有变成作品，却变成了经验。后来我每次新建项目，都会想起那个杂乱的文件夹，然后提醒自己从一开始就把东西放清楚一点。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2018-custom-pc-build&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;我的第一台个人组装电脑：从配置单到点亮屏幕&quot;],&quot;description&quot;:[0,&quot;一次个人电脑组装经历，从研究配置到第一次点亮屏幕。&quot;],&quot;date&quot;:[3,&quot;2018-02-04T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2018-custom-pc-build.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;生活随笔&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2018&quot;],[0,&quot;电脑装机&quot;],[0,&quot;硬件&quot;],[0,&quot;生活记录&quot;]]],&quot;category&quot;:[0,&quot;生活随笔&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2018 年我第一次认真考虑组装一台自己的电脑。起因很简单：原来的机器越来越慢，写代码、开浏览器、查资料同时进行时，经常会卡得让人失去耐心。那时我没有太多预算，所以每一个配件都要反复比较。\n\n![第一次装机](/images/posts/personal-growth/2018-custom-pc-build.jpg)\n\n配置单看了很多版。CPU、主板、内存、硬盘、电源，每个名字后面都有一堆参数。刚开始我只看价格，后来才慢慢知道，便宜不一定合适，贵也不一定用得上。真正适合自己的配置，应该和用途、预算、未来升级空间放在一起看。\n\n装机那天其实有点紧张。拆包装、装 CPU、扣内存、接电源线，每一步都怕用力过猛。机箱里的线比我想象中多，说明书也并不总是那么直观。最麻烦的是前面板跳线，小小几根线要接到主板对应位置，接错了可能开机键都没反应。\n\n第一次按下电源键，风扇转起来，屏幕亮起来，那一刻真的很踏实。它不是商店里直接买回来的整机，而是一件自己一件件拼起来的工具。虽然过程不算顺利，中间也查了很多资料，但点亮屏幕以后，之前的紧张都变成了成就感。\n\n这次装机也影响了我后来理解技术的方式。硬件让我看到，电脑不是一个抽象的黑盒。性能来自具体的部件，稳定来自合适的搭配，问题也往往有实际原因。\n\n那台电脑后来陪我写过代码、改过页面、做过很多小实验。它不是什么顶级配置，但对当时的我来说已经足够。更重要的是，我从它身上学到一种朴素的判断：先弄清楚自己真正需要什么，再去选择工具。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2018-failed-project-lessons&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;一次失败项目教会我的三件事&quot;],&quot;description&quot;:[0,&quot;从一次没有做完的项目里整理出三条朴素经验。&quot;],&quot;date&quot;:[3,&quot;2018-11-09T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2018-failed-project-lessons.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;项目复盘&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2018&quot;],[0,&quot;项目复盘&quot;],[0,&quot;失败经验&quot;],[0,&quot;成长&quot;]]],&quot;category&quot;:[0,&quot;项目复盘&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2018 年有一个项目做得很不顺。开始时想法很多，觉得页面要好看，功能要完整，最好还能做一点自己的特色。真正动手以后才发现，想法越多，越容易把自己拖住。\n\n![失败项目复盘](/images/posts/personal-growth/2018-failed-project-lessons.jpg)\n\n第一件事，是不要一开始就追求完整。那时我总想先把架构搭好，把所有页面列出来，把以后可能用到的功能也预留上。结果基础功能还没跑通，项目已经变得很重。后来我才知道，很多个人项目应该先做最小可用版本，哪怕它很简陋，也比一个永远搭不完的框架更有价值。\n\n第二件事，是记录决策比记录代码更重要。代码还能重新看，决策如果不写下来，很快就会忘。为什么选这个方案，为什么放弃另一个功能，为什么这个页面暂时不做，这些东西在项目卡住时特别有用。没有记录的时候，每次回到项目都像重新进入一个陌生现场。\n\n第三件事，是要承认精力有限。很多失败不是因为能力太差，而是没有给自己留现实空间。白天有别的事情，晚上时间也不稳定，如果还按一个完整产品的标准要求自己，很容易越做越累。\n\n这个项目最后没有完成，但它让我对“失败”这个词没那么害怕了。失败项目不是简单的浪费时间，它会暴露出自己的习惯问题：喜欢想太多，害怕做取舍，不愿意及时停下来复盘。\n\n后来再做东西，我会先问自己三个问题：最核心的功能是什么？这周能不能看到一个小结果？如果做不完，哪些部分可以先放下？这些问题很普通，却帮我少走了很多弯路。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2018-graphql-mainstream&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2018：GraphQL 从实验走向生产&quot;],&quot;description&quot;:[0,&quot;GitHub API v4、Apollo 生态成熟和前端数据层需求的演变，推动 GraphQL 在 2018 年成为 API 设计的可行替代方案。&quot;],&quot;date&quot;:[3,&quot;2018-12-31T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=GraphQL+2018&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2018&quot;],[0,&quot;GraphQL&quot;],[0,&quot;API&quot;],[0,&quot;前端&quot;],[0,&quot;后端&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;The GitHub GraphQL API&quot;],&quot;url&quot;:[0,&quot;https://github.blog/2016-09-14-the-github-graphql-api/&quot;],&quot;publisher&quot;:[0,&quot;GitHub Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;GraphQL Foundation Launches&quot;],&quot;url&quot;:[0,&quot;https://www.linuxfoundation.org/press/press-release/graphql-foundation&quot;],&quot;publisher&quot;:[0,&quot;Linux Foundation&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;State of JavaScript 2018: GraphQL&quot;],&quot;url&quot;:[0,&quot;https://2018.stateofjs.com/data-layer/graphql/&quot;],&quot;publisher&quot;:[0,&quot;State of JS&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2018 年，GraphQL 完成了从 Facebook 的内部项目到全行业关注的技术选项的转变。这一年最关键的信号不是某个版本更新，而是生态的成熟和机构的认可。\n\n## GitHub API v4 的品牌效应\n\nGitHub 在 2016 年底就发布了 GraphQL API v4，但它的影响在 2018 年才真正扩散开来。当全球最大的代码托管平台将 GraphQL 作为其核心 API 范式时，它给了大量团队一个强有力的参考案例。\n\n开发者可以实际看到：不需要关系复杂的 REST 端点，单一请求就能精确获取所需数据，这在前后端分离和移动端需要精细控制数据摄入的场景中优势明显。\n\n## Apollo 和客户端生态的成熟\n\n2018 年，Apollo 围绕 GraphQL 构建的工具链达到了生产可用水平：\n\n- Apollo Client 2.0 引入了更完善的缓存和状态管理\n- Apollo Server 让后端搭建 GraphQL 服务的门槛大幅降低\n- Apollo Engine 提供了监控、追踪和 schema 管理能力\n\n同时，Prisma、Hasura 等工具也在这一年获得关注，让 GraphQL 不只是前端团队关心的话题，也成为后端数据层架构的严肃选项。\n\n## GraphQL 基金会的成立\n\n2018 年底，Linux 基金会宣布成立 GraphQL 基金会，Facebook 将 GraphQL 的商标和规范治理权移交给了基金会。这让 GraphQL 从单公司控制的项目变成了社区治理的开放标准。\n\n**观点判断：** GraphQL 的价值不在于它&#39;替代 REST&#39;，而在于它让 API 设计开始关注&#39;客户端需要什么数据&#39;而非&#39;服务端有什么资源&#39;。这个思维转换比具体的技术选型更重要。\n\n## 小结\n\n2018 年是 GraphQL 从早鸟实验走向团队决策的一年。GitHub 的示范效应、Apollo 的工具链成熟和基金会的成立，让 GraphQL 不再是冒险者的选项，而是有完整生态支撑的技术栈。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2018-kubernetes-standard&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2018：Kubernetes 成为容器编排的事实标准&quot;],&quot;description&quot;:[0,&quot;从 Docker 集成、CNCF 成熟度、AWS EKS 发布和社区治理观察 Kubernetes 在 2018 年确立平台地位的路径。&quot;],&quot;date&quot;:[3,&quot;2018-12-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=Kubernetes+2018&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2018&quot;],[0,&quot;Kubernetes&quot;],[0,&quot;云原生&quot;],[0,&quot;容器&quot;],[0,&quot;基础设施&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Amazon EKS Now Generally Available&quot;],&quot;url&quot;:[0,&quot;https://aws.amazon.com/blogs/aws/amazon-eks-now-generally-available/&quot;],&quot;publisher&quot;:[0,&quot;AWS Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Docker Kubernetes Integration Announced&quot;],&quot;url&quot;:[0,&quot;https://www.docker.com/blog/kubernetes-docker-platform-and-moby-project/&quot;],&quot;publisher&quot;:[0,&quot;Docker Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;CNCF Annual Report 2018&quot;],&quot;url&quot;:[0,&quot;https://www.cncf.io/reports/cncf-annual-report-2018/&quot;],&quot;publisher&quot;:[0,&quot;CNCF&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2018 年，容器编排之战正式落下帷幕。Kubernetes 从众多竞争者（Docker Swarm、Mesos、Nomad）中胜出，成为云原生基础设施的事实标准。\n\n## 三大云厂商全面托管\n\n2018 年 6 月，AWS 终于推出 EKS（Elastic Kubernetes Service）的正式版本，补上了三大云厂商 Kubernetes 托管服务的最后一块拼图。就在一年前的 2017 年，Azure 推出了 AKS，Google 的 GKE 已经运行多年。\n\n当三大云厂商各自拥有成熟 Kubernetes 托管服务时，意味着 Kubernetes 不再只是早期采用者的实验工具，而是企业可以纳入采购清单的基础设施产品。CNCF 2018 年度报告称参与 CNCF 项目的组织和贡献者数量在这一年翻了一番。\n\n## Docker 从竞争者转为集成者\n\n如果 2017 年 Docker 宣布 Moby Project 还只是拆分信号，2018 年 Docker EE 与 Kubernetes 的原生集成则是一次明确的战略转向。Docker 不再试图在编排层与 K8s 竞争，而是选择成为 K8s 生态的一部分。\n\n这个决定的影响深远。Docker 作为容器化的代名词，其团队和产品向 K8s 靠拢，意味着容器编排的标准化方向已经没有悬念。\n\n## 社区治理与生产就绪\n\n2018 年，Kubernetes 社区在治理和技术成熟度上都迈出了重要一步：\n\n- 发布周期稳定下来，每个季度一次小版本\n- 引入了基于 SIG（Special Interest Group）的社区治理模型\n- Helm 成为 CNCF 孵化项目，包管理工具走向成熟\n- 服务网格（Istio、Linkerd）开始与 K8s 深度整合\n\n**观点判断：** 2018 年 Kubernetes 的胜利不代表容器的故事讲完了。恰恰相反，容器编排的标准化意味着下一个问题开始浮现：可观测性、安全策略、成本优化、多集群管理——这些才是生产中真正复杂的部分。\n\n## 小结\n\n2018 年是 Kubernetes 确立平台地位的关键一年。三大云厂商的托管服务、Docker 的战略转向和社区治理的成熟，让容器编排从&#39;选什么&#39;变成了&#39;怎么做好&#39;。云原生的基础层在这一年趋于稳定，但应用层的分布式系统复杂性才刚刚展开。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2018-life-in-markdown&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;把生活装进 Markdown：我的效率工具实验&quot;],&quot;description&quot;:[0,&quot;从 Markdown 开始整理学习、生活和碎片想法。&quot;],&quot;date&quot;:[3,&quot;2018-07-21T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2018-life-in-markdown.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;生活随笔&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2018&quot;],[0,&quot;Markdown&quot;],[0,&quot;效率工具&quot;],[0,&quot;知识管理&quot;]]],&quot;category&quot;:[0,&quot;生活随笔&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;第一次认真使用 Markdown，是因为想把学习笔记写得干净一点。以前的记录很随意，今天写在文档里，明天写在聊天窗口，后天又放到手机备忘录。等真的要找的时候，基本都找不到。\n\n![Markdown 日常](/images/posts/personal-growth/2018-life-in-markdown.jpg)\n\nMarkdown 给我的感觉很轻。标题、列表、代码块、链接，几个简单符号就够用了。它不像复杂文档工具那样需要先调格式，也不像纯文本那样完全没有结构。对我来说，它刚好卡在一个舒服的位置：足够简单，也足够清楚。\n\n刚开始我把它当作学习笔记工具。看教程时记概念，遇到报错时记解决办法，做项目时记下一些临时想法。后来慢慢扩展到生活里，比如月度计划、读书摘录、买东西前的比较清单。很多事情只要写下来，就没有一直悬在脑子里那么累。\n\n这套实验并没有让我突然变得特别高效。更多时候，它只是减少了一点混乱。以前想法散在各处，现在至少可以放进一个文件夹。以前解决过的问题过几天又忘，现在可以回头搜一下。\n\n我也走过弯路。曾经花很多时间设计目录和模板，结果真正写的内容反而变少了。后来才明白，工具的重点不是把系统搭得多漂亮，而是让自己愿意持续使用。\n\n到 2018 年下半年，Markdown 已经变成我生活里很自然的一部分。它没有解决所有问题，但帮我建立了一种习惯：把模糊的东西写下来，把混乱的事情排一排。很多改变不是从大计划开始的，而是从一个普通的文本文件开始的。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2018-typescript-breakout&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2018：TypeScript 的爆发年&quot;],&quot;description&quot;:[0,&quot;从 Stack Overflow 开发者调查、Babel 支持、VS Code 深度集成和大厂项目迁移，看 TypeScript 如何成为前端工程化的主流选项。&quot;],&quot;date&quot;:[3,&quot;2018-12-29T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=TypeScript+2018&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2018&quot;],[0,&quot;TypeScript&quot;],[0,&quot;前端&quot;],[0,&quot;JavaScript&quot;],[0,&quot;工程化&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Stack Overflow Developer Survey 2018&quot;],&quot;url&quot;:[0,&quot;https://insights.stackoverflow.com/survey/2018&quot;],&quot;publisher&quot;:[0,&quot;Stack Overflow&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;TypeScript at Google&quot;],&quot;url&quot;:[0,&quot;https://devblogs.microsoft.com/typescript/typescript-at-google/&quot;],&quot;publisher&quot;:[0,&quot;TypeScript Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Babel 7 released with TypeScript support&quot;],&quot;url&quot;:[0,&quot;https://babeljs.io/blog/2018/08/27/7.0.0&quot;],&quot;publisher&quot;:[0,&quot;Babel Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;npm 2018 JavaScript Ecosystem Survey&quot;],&quot;url&quot;:[0,&quot;https://npmjs.org/2018-javascript-ecosystem-survey&quot;],&quot;publisher&quot;:[0,&quot;npm Inc.&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2018 年之前，TypeScript 已经在 Angular 2+ 生态中被广泛使用，但多数前端开发者仍视其为\&quot;Angular 专属\&quot;的语言扩展。2018 年，这个认知被彻底打破。\n\n## 数据不会说谎\n\nStack Overflow 2018 年开发者调查显示，TypeScript 名列\&quot;最受喜爱的编程语言\&quot;前三，超过 67% 的使用者愿意继续使用。同一年，npm 的调查报告指出，TypeScript 的下载量同比增长超过 100%。\n\n更重要的是，JavaScript 社区的核心基础设施开始主动支持 TypeScript。Babel 7 在 2018 年 8 月发布，正式引入 TypeScript 编译支持——这意味着不依赖 TypeScript 编译器也能将 `.ts` 文件转换为 JavaScript。这是社区对 TypeScript 的一次重要认可。\n\n## 大厂迁移的信号\n\n2018 年发生了几个标志性的迁移事件：\n\n- Google 内部开始大规模采用 TypeScript，TypeScript 官方博客专门撰文介绍了 Google 的实践\n- Airbnb 将其 JavaScript 风格指南转换为 TypeScript 版本\n- Jest（Facebook 的测试框架）对 TypeScript 的支持大幅改善\n- VS Code 中的 TypeScript 语言服务持续深度集成，为开发者提供了接近 IDE 级别的体验\n\n当 Google 和 Facebook 的工程团队同时认可一门语言时，它就不再只是\&quot;可选项\&quot;了，而是正在成为\&quot;默认项\&quot;。\n\n## JavaScript 世界的类型化转型\n\nTypeScript 的突破意义不只在于一门语言的成功。它代表了 JavaScript 社区对\&quot;工程化质量\&quot;的追求达到了一个新阶段。\n\n在 JavaScript 二十年历史的大部分时间里，\&quot;动态类型 = 灵活\&quot;是主流叙事。TypeScript 证明了静态类型检查和现代工具链可以同时拥有灵活性和可靠性，不需要在二者之间取舍。\n\n**观点判断：** 2018 年回头看，最重要的前端事件可能不是某个框架的新版本，而是 TypeScript 进入主流。它改变了团队协作方式、代码审查流程和项目重构的难度，对前端工程化的影响周期比任何框架的版本更新都更长。\n\n## 小结\n\nTypeScript 在 2018 年完成了从\&quot;小众选择\&quot;到\&quot;主流共识\&quot;的转变。Babel 7 的 TypeScript 支持和各大厂的项目迁移是关键信号。这一年的 TypeScript 不是赢在技术参数上，而是赢在了团队协作和长期维护的工程价值上。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2019-flutter-cross-platform&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2019：Flutter 1.0 和跨平台开发的范式转移&quot;],&quot;description&quot;:[0,&quot;Google 在 2018 年底发布 Flutter 1.0，2019 年 Flutter 快速成为跨平台移动开发最受关注的技术选项之一。&quot;],&quot;date&quot;:[3,&quot;2019-12-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=Flutter+2019&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2019&quot;],[0,&quot;Flutter&quot;],[0,&quot;跨平台&quot;],[0,&quot;移动开发&quot;],[0,&quot;Dart&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Flutter 1.0: Google&#39;s Portable UI Toolkit&quot;],&quot;url&quot;:[0,&quot;https://developers.googleblog.com/2018/12/flutter-10-googles-portable-ui-toolkit.html&quot;],&quot;publisher&quot;:[0,&quot;Google Developers Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Stack Overflow Developer Survey 2019&quot;],&quot;url&quot;:[0,&quot;https://insights.stackoverflow.com/survey/2019&quot;],&quot;publisher&quot;:[0,&quot;Stack Overflow&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Flutter 1.9 Release&quot;],&quot;url&quot;:[0,&quot;https://medium.com/flutter/flutter-1-9-release-5b48d56e9270&quot;],&quot;publisher&quot;:[0,&quot;Flutter Medium&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2018 年 12 月，Google 在 Flutter Live 上宣布 Flutter 1.0 正式发布。但在社区层面，Flutter 真正的起飞年是在 2019 年。\n\n## 对 React Native 的挑战\n\nReact Native 发布以来一直是跨平台移动开发的首选方案。但 Flutter 带来了几个不同的技术选择：\n\n- 自绘引擎（Skia）而非原生控件桥接——性能更可预测\n- Dart 语言而非 JavaScript——编译为原生 ARM 代码\n- 同时覆盖 iOS 和 Android，且 UI 一致性更高\n\n2019 年 Stack Overflow 开发者调查中，Flutter 被评为\&quot;最受喜爱的框架\&quot;之一，高达 75.4% 的受访者表示愿意继续使用——这个数据在当时极为亮眼。\n\n## 关键里程碑\n\n2019 年 Flutter 经历了快速迭代：\n\n- 2019 年 2 月：Flutter 1.2 发布，改进了开发者工具链\n- 2019 年 5 月：Google I/O 宣布 Flutter for Web 技术预览版——从\&quot;移动端框架\&quot;到\&quot;全平台 UI 框架\&quot;\n- 2019 年 9 月：Flutter 1.9 发布，macOS Catalina 兼容，Material Design 组件更新\n- 2019 年底：大量生产应用开始采用 Flutter，包括阿里巴巴、腾讯等中国互联网公司的多个产品线\n\n## Dart 语言的复兴\n\nFlutter 的成功意外复活了 Dart 语言。原本在 TypeScript 面前失去吸引力的 Dart，因为 Flutter 而获得了明确的生存空间。Google 也宣布 Flutter 和 Dart 是中长期投入方向。\n\n**观点判断：** Flutter 在 2019 年的快速增长反映了一个行业规律：跨平台方案的成功不只取决于技术本身，还取决于生态、团队投入和时机。Flutter 恰好赶上了移动端应用对性能和 UI 一致性要求提升的周期，而 React Native 社区当时也处于重构和调整期。\n\n## 小结\n\n2019 年是 Flutter 从\&quot;Google 的新潮框架\&quot;走向\&quot;跨平台开发严肃选项\&quot;的一年。Web 支持的技术预览版更是将 Flutter 的能力边界从移动端扩展到了全平台。对于开发者来说，它代表着跨平台方案在\&quot;接近原生体验\&quot;这个方向上迈出的重要一步。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2019-from-tutorial-to-solving&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;从教程依赖到独立解决问题&quot;],&quot;description&quot;:[0,&quot;从跟教程走，到自己拆问题、查资料和验证答案。&quot;],&quot;date&quot;:[3,&quot;2019-09-26T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2019-from-tutorial-to-solving.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2019&quot;],[0,&quot;学习方法&quot;],[0,&quot;问题解决&quot;],[0,&quot;技术成长&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;有一段时间，我特别依赖教程。只要跟着视频一步一步做，项目基本都能跑起来。那种感觉很舒服，因为每一步都有答案。但离开教程以后，问题很快就来了：同样的功能换一个场景，我就不知道怎么写了。\n\n![独立解决问题](/images/posts/personal-growth/2019-from-tutorial-to-solving.jpg)\n\n2019 年我开始有意识地减少照抄。看教程时不急着写，而是先想它要解决什么问题。代码复制之前，先试着自己写一个版本。报错出现时，也不马上去评论区找答案，而是先看控制台，看文档，看自己哪里假设错了。\n\n这个过程很慢，也很挫败。以前一小时能跟完一节课，现在可能一晚上只解决一个小问题。但这种慢带来的收获更实在。问题解决以后，我知道自己为什么这样写，也知道下次遇到类似情况应该从哪里开始。\n\n我发现独立解决问题并不是完全靠自己硬扛。它更像是会使用外部资源：知道该搜什么关键词，知道文档里哪个部分可能有答案，知道别人的代码为什么能用，知道复制之前要先理解边界。\n\n那时我还养成了一个习惯：每解决一个让我卡住的问题，就把原因和处理步骤写下来。刚开始记录得很啰嗦，后来慢慢变成几个要点。这个小习惯帮了我很多，因为很多问题其实会反复出现。\n\n从教程依赖走出来以后，我对学习的理解变了。教程可以带人入门，但不能替自己完成判断。真正的成长，是能在没有标准答案的时候，把问题拆开，一步一步试到它变清楚。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2019-gpt2-language-model&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2019：GPT-2 和语言模型的能力边界&quot;],&quot;description&quot;:[0,&quot;OpenAI 发布 GPT-2 时决定暂不公开完整模型，引发了一场关于 AI 能力、发布策略和安全讨论的全球对话。&quot;],&quot;date&quot;:[3,&quot;2019-12-29T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=GPT-2+2019&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2019&quot;],[0,&quot;AI&quot;],[0,&quot;NLP&quot;],[0,&quot;GPT-2&quot;],[0,&quot;OpenAI&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Better Language Models and Their Implications&quot;],&quot;url&quot;:[0,&quot;https://openai.com/research/better-language-models&quot;],&quot;publisher&quot;:[0,&quot;OpenAI&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;GPT-2: 1.5B Release&quot;],&quot;url&quot;:[0,&quot;https://openai.com/index/gpt-2-1-5b-release/&quot;],&quot;publisher&quot;:[0,&quot;OpenAI&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;BERT: Pre-training of Deep Bidirectional Transformers&quot;],&quot;url&quot;:[0,&quot;https://arxiv.org/abs/1810.04805&quot;],&quot;publisher&quot;:[0,&quot;Google AI&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2019 年，自然语言处理领域发生了两件事：BERT 在 2018 年底提出后持续影响学术界，GPT-2 则在 2019 年 2 月让公众第一次真正感受到大规模语言模型的能力和潜在风险。\n\n## OpenAI 的分阶段发布\n\nOpenAI 在 2019 年 2 月宣布 GPT-2 模型时做出了一个引人注目的决定：暂不发布完整的大规模模型，而是分阶段逐步放出。团队在博客中写道，担心该模型可能被滥用于生成误导性新闻、冒充他人或自动生成垃圾内容。\n\n这个决定引发了激烈的行业讨论。一部分人认为这夸大了风险，另一部分人则认为这开启了负责任的 AI 发布先例。\n\n最终 OpenAI 在 2019 年 11 月发布了完整的 15 亿参数 GPT-2 模型，期间并未观察到明确的恶意用途。\n\n## 语言模型能力的质变\n\nGPT-2 在一系列任务上的表现超出了很多人的预期：长文本生成、翻译、问答、摘要——一个没有针对特定任务训练的模型，仅通过\&quot;预测下一个词\&quot;就获得了这些能力。\n\n从技术角度看，GPT-2 的核心机制并不复杂：基于 Transformer 的自回归语言模型，在海量网络文本上训练。但它证明了一个重要假设：足够大的模型 + 足够多的数据，可以让\&quot;无监督预训练\&quot;产生远超预期的能力。\n\n## 对整个 AI 领域的影响\n\nGPT-2 的影响超出了 NLP 圈：\n\n- 它让\&quot;规模扩展（scaling）\&quot;成为 AI 研究的重要方向——更大的模型、更多的数据、更强的计算\n- 它引发了关于 AI 安全、滥用的全球对话\n- 它为后续 GPT-3、ChatGPT 铺平了道路\n- 它让非 AI 从业者也开始认真关注大语言模型的发展\n\n**观点判断：** 2019 年的 GPT-2 在技术能力上远不如后来的 GPT-3 和 GPT-4，但它在行业认知上的影响可能更大：关于 AI 发布策略、能力边界、风险框架的严肃讨论，是从 GPT-2 开始的。\n\n## 小结\n\nGPT-2 在 2019 年触发了一场关于 AI 能力、风险与责任的全球对话。从技术上看，它证明了\&quot;规模化\&quot;的有效性；从行业上看，它开始让公众意识到大语言模型正在快速逼近一个需要认真对待的水平。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2019-javascript-expression&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;JavaScript 让我重新理解“表达”&quot;],&quot;description&quot;:[0,&quot;记录学习 JavaScript 时，从照抄语法到理解表达方式的转变。&quot;],&quot;date&quot;:[3,&quot;2019-04-18T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2019-javascript-expression.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2019&quot;],[0,&quot;JavaScript&quot;],[0,&quot;前端&quot;],[0,&quot;技术成长&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2019 年我花了不少时间重新学习 JavaScript。之前也写过一些脚本，但更多是照着例子改。直到后来开始认真看变量、函数、对象、数组这些基础，才发现自己其实只是会用一点，并没有真的理解它。\n\n![JavaScript 表达](/images/posts/personal-growth/2019-javascript-expression.jpg)\n\nJavaScript 最吸引我的地方，是它很适合表达页面上的变化。按钮被点击，数据被更新，列表重新渲染，用户输入被检查，这些都可以用很直接的方式写出来。它不像一门离生活很远的语言，而是和网页上的每一个动作连在一起。\n\n刚开始我经常被异步弄糊涂。代码明明写在前面，结果却不一定先发生。请求、回调、Promise，这些概念让我意识到，程序不是一条永远直线向下的路。它更像一组等待发生的事情，需要你安排好先后和关系。\n\n学习 JavaScript 也让我慢慢重视命名。以前觉得变量名随便写，只要能跑就行。后来代码稍微长一点，就会发现糟糕的命名会让自己完全看不懂。一个清楚的名字，其实是在给未来的自己解释当下的想法。\n\n那一年我写了很多小练习：待办事项、计时器、简单表单、图片切换。它们都不复杂，但每一个都让我更熟悉“状态”这件事。页面不是静止的，它会因为数据变化而变化。\n\n现在再看，JavaScript 带给我的不只是语法能力，而是一种表达方式。它让我学会把用户动作、数据变化和页面反馈联系起来。技术学习很多时候就是这样，先是会写，后来才慢慢明白自己在表达什么。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2019-react-hooks&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2019：React Hooks 重新定义组件范式&quot;],&quot;description&quot;:[0,&quot;React 16.8 引入 Hooks 不仅是 API 变化，更是从类组件到函数组件的思维范式迁移，影响随后数年整个前端生态。&quot;],&quot;date&quot;:[3,&quot;2019-12-28T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=React+Hooks+2019&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2019&quot;],[0,&quot;React&quot;],[0,&quot;前端&quot;],[0,&quot;JavaScript&quot;],[0,&quot;Hooks&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Introducing Hooks&quot;],&quot;url&quot;:[0,&quot;https://react.dev/blog/2019/02/06/react-v16.8.0&quot;],&quot;publisher&quot;:[0,&quot;React Blog&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;State of JavaScript 2019&quot;],&quot;url&quot;:[0,&quot;https://2019.stateofjs.com/front-end-frameworks/react/&quot;],&quot;publisher&quot;:[0,&quot;State of JS&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Why React Hooks&quot;],&quot;url&quot;:[0,&quot;https://react.dev/reference/react/hooks&quot;],&quot;publisher&quot;:[0,&quot;React Docs&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;React 16.8 在 2019 年 2 月 6 日发布，Hooks 正式进入稳定版本。这不是一次普通的 API 添加，它重新定义了 React 开发者思考组件的方式。\n\n## 类组件的问题\n\n在 Hooks 之前，React 开发者面临几个长期困扰：\n\n- 类组件中逻辑复用困难，高阶组件（HOC）和 render props 导致\&quot;包装地狱\&quot;\n- 生命周期方法（componentDidMount、componentDidUpdate、componentWillUnmount）将相关逻辑分散在不同方法中\n- 类组件中的 `this` 绑定困惑，增加了学习曲线和代码量\n\nHooks 用一个统一的原语解决了这些问题：函数组件可以通过 `useState`、`useEffect` 等 hook 获得状态和副作用能力，不需要改为类组件。\n\n## 社区快速迁移\n\nState of JavaScript 2019 调查显示，超过 80% 的 React 开发者已经在使用 Hooks。这个迁移速度在框架历史上极为罕见。\n\n原因有几个：\n\n- React 官方明确表示 Hooks 是推荐方向，但类组件不会被移除——提供了逐步迁移的路径\n- `useEffect` 将相关副作用代码聚合在一起，代码可读性明显改善\n- 自定义 Hook 让逻辑复用变得非常自然：一个函数封装一段状态逻辑，在任何组件中调用\n\n## 影响范围超出 React\n\nHooks 的思维模型影响了整个前端生态：\n\n- Vue 3 的 Composition API 直接受 Hooks 启发，在 2019 年进入 RFC 阶段\n- 其他框架和库开始重新审视\&quot;函数式 + 组合\&quot;的组件模型\n- 状态管理库（Redux、MobX）也推出了对应的 Hooks API\n\n**观点判断：** React Hooks 的意义不在于技术实现本身，而在于它证明了\&quot;函数式的组件模型更易于推理、组合和维护\&quot;。这个认知被整个前端社区接受，影响了 2019 年之后几乎所有新框架的设计方向。\n\n## 小结\n\n2019 年是 React Hooks 的落地年。从技术角度看，它统一了状态逻辑的复用方式；从行业角度看，它推动了函数式编程在前端领域的进一步普及。Hooks 之后写 React 的方式变了，而且不会再变回去。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2020-gpt3-ai-api&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2020：GPT-3 和 AI 作为 API 的范式转变&quot;],&quot;description&quot;:[0,&quot;OpenAI 在 2020 年中发布 GPT-3，并提供商业化 API 访问。这是大语言模型从研究实验走向产品化的关键一步。&quot;],&quot;date&quot;:[3,&quot;2020-12-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=GPT-3+2020&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2020&quot;],[0,&quot;AI&quot;],[0,&quot;GPT-3&quot;],[0,&quot;OpenAI&quot;],[0,&quot;API&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Language Models are Few-Shot Learners&quot;],&quot;url&quot;:[0,&quot;https://arxiv.org/abs/2005.14165&quot;],&quot;publisher&quot;:[0,&quot;arXiv (OpenAI)&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;OpenAI API&quot;],&quot;url&quot;:[0,&quot;https://openai.com/index/openai-api/&quot;],&quot;publisher&quot;:[0,&quot;OpenAI&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;GPT-3 Creative Fiction&quot;],&quot;url&quot;:[0,&quot;https://www.gwern.net/GPT-3&quot;],&quot;publisher&quot;:[0,&quot;Gwern.net&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2020 年 5 月，OpenAI 发布了一篇 72 页的论文《Language Models are Few-Shot Learners》，介绍了 GPT-3——一个 1750 亿参数的语言模型。但真正改变游戏规则的，是它通过 API 的商业化提供方式。\n\n## \&quot;大\&quot;的重要性\n\nGPT-3 最直接的冲击来自规模：1750 亿参数，比 GPT-2（15 亿）增加了约 100 倍。但参数数量只是表象，重要的是大规模带来的能力跃迁：\n\n- **Few-shot 学习**：给几个示例，模型就能理解任务格式并完成类似工作——无需微调\n- **跨领域能力**：同一个模型可以进行翻译、摘要、问答、代码生成、创意写作\n- **代码生成**：GPT-3 可以根据自然语言描述生成简单的代码，这是 GPT-2 无法稳健完成的任务\n\n## AI 即 API\n\n2020 年 6 月，OpenAI 发布了 GPT-3 API 的商业版本。这意味着任何开发者可以通过 API 调用访问当时最强大的语言模型，不需要自己训练或托管模型。\n\n这个范式的意义怎么强调都不过分：\n\n- 一个小团队可以通过 API 调用在产品中加入 AI 能力，无需 ML 专家\n- 涌现了大量基于 GPT-3 的创业项目：AI 写作、代码助手、聊天机器人、知识问答\n- \&quot;Prompt Engineering\&quot; 作为一种新的交互范式开始形成\n\n**观点判断：** GPT-3 在技术参数上比 GPT-2 更大更强，但它真正的行业意义在于证明了\&quot;AI 能力可以通过 API 分发\&quot;。这改变了 AI 商业化的路径：不一定要拥有模型，要的是拥有通过 API 构建产品的能力。\n\n## 影响在扩散\n\nGPT-3 的发布引发了一系列连锁反应：\n\n- GitHub Copilot 在 2021 年 6 月发布技术预览版，其底层技术基于 OpenAI Codex（GPT-3 的代码版本）\n- Google、Microsoft、Meta 等大厂加速了大语言模型的研发投入\n- AI 安全和伦理的讨论从学术圈扩展到产业界和监管机构\n- 开发者社区开始探索 prompt engineering、chain-of-thought 等与大模型交互的新方法\n\n## 小结\n\n2020 年的 GPT-3 不只是一次模型升级。它开创了\&quot;AI 能力 API 化\&quot;的商业模式，让大语言模型从少数研究机构的玩具变成了任何开发者都可以接入的基础设施。这个范式转变是后来 ChatGPT 和整个生成式 AI 浪潮的地基。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2020-nextjs-jamstack&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2020：Next.js 和静态站点的复兴浪潮&quot;],&quot;description&quot;:[0,&quot;Next.js 9.3 引入 SSG、ISR 等能力，配合 Jamstack 架构理念，让静态网站生成从边缘玩法变成前端架构的主流选项。&quot;],&quot;date&quot;:[3,&quot;2020-12-29T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=Next.js+Jamstack+2020&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2020&quot;],[0,&quot;Next.js&quot;],[0,&quot;Jamstack&quot;],[0,&quot;SSG&quot;],[0,&quot;React&quot;],[0,&quot;前端&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;Next.js 9.3: Static Site Generation&quot;],&quot;url&quot;:[0,&quot;https://nextjs.org/blog/next-9-3&quot;],&quot;publisher&quot;:[0,&quot;Vercel&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Jamstack Community Survey 2020&quot;],&quot;url&quot;:[0,&quot;https://jamstack.org/survey/2020/&quot;],&quot;publisher&quot;:[0,&quot;Jamstack&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;Incremental Static Regeneration&quot;],&quot;url&quot;:[0,&quot;https://nextjs.org/blog/next-9-5&quot;],&quot;publisher&quot;:[0,&quot;Vercel&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2020 年，前端部署范式发生了一次反转：曾经被认为\&quot;过时\&quot;的静态网站生成（SSG）以 Jamstack 的名义强势回归，并成为许多团队的首选架构。\n\n## SSG 和 ISR 的工程突破\n\nNext.js 9.3 在 2020 年 3 月发布了三个关键特性构建了新的架构选项：\n\n- **getStaticProps**：构建时获取数据并生成静态 HTML，页面速度极快\n- **getServerSideProps**：保留服务端渲染能力用于动态数据场景\n- 后续 9.5 版本引入 **ISR（Incremental Static Regeneration）**：在运行时按需重新生成静态页面，解决了传统静态生成的内容更新延迟问题\n\nISR 消除了\&quot;静态站点 = 内容更新延迟\&quot;的旧有等式。你可以同时拥有静态页面的性能和动态内容的时效性——这在之前被认为难以兼得。\n\n## Jamstack 生态的工程化\n\nJamstack（JavaScript + API + Markup）在 2020 年从社群概念变成了工程实践：\n\n- Netlify、Vercel 两家平台在部署体验上激烈竞争，推动了边缘计算和预览部署能力的快速进化\n- 无头 CMS（Contentful、Strapi、Sanity）在这一年获得大量企业级采用\n- Gatsby、Hugo、Eleventy 以及后来的 Astro，形成了多选项的 SSG 生态\n- Jamstack Community Survey 2020 显示超过 60% 的受访者已经在生产环境中使用 Jamstack\n\n## 静态优先成为架构选择\n\n**观点判断：** 2020 年的 Jamstack 复兴不是\&quot;静态网站变酷了\&quot;，而是现代前端部署基础设施（CDN、边缘函数、构建工具）让静态优先成为了一种高级架构选择。性能和稳定性不再需要以牺牲动态性为代价。这是一个架构原则的回归：尽量把计算放到构建时，运行时只做必要的事。\n\n## 小结\n\nNext.js 的 SSG 和 ISR 突破让静态生成从博客和文档站的应用场景扩展到了电商、SaaS 落地页和内容平台。2020 年是\&quot;静态优先\&quot;从前卫选择走向团队默认选项的转折年。对于开发者来说，它意味着部署和架构的复杂度在一次范式转移中下降了。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2020-remote-learning-self-management&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;疫情时代的远程学习与自我管理&quot;],&quot;description&quot;:[0,&quot;疫情时期远程学习的生活节奏，以及对自我管理的重新认识。&quot;],&quot;date&quot;:[3,&quot;2020-03-22T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2020-remote-learning-self-management.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;生活随笔&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2020&quot;],[0,&quot;远程学习&quot;],[0,&quot;自我管理&quot;],[0,&quot;生活记录&quot;]]],&quot;category&quot;:[0,&quot;生活随笔&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2020 年很多事情突然变慢，也突然变得不确定。学习和工作从固定地点搬回房间里，原本清楚的边界一下子模糊了。早上打开电脑，晚上还是同一台电脑，中间到底完成了什么，有时自己也说不清。\n\n![远程学习](/images/posts/personal-growth/2020-remote-learning-self-management.jpg)\n\n刚开始远程学习时，我以为只要时间变多，效率自然会提高。事实正好相反。没有固定环境以后，人很容易分心。手机、消息、临时想法、家里的杂事，都会把注意力切碎。一天看起来很满，真正深入做事的时间却不多。\n\n后来我开始给自己设一些简单规则。早上先列三件最重要的事，不追求写满清单。学习时把手机放远一点。每隔一段时间站起来走一走。晚上尽量做一个简短回顾，看看今天到底推进了什么。\n\n这些方法都不新鲜，但在那个时候很有用。它们让我明白，自我管理不是把自己管得很紧，而是给生活重新建立几个支点。没有外部节奏的时候，内部节奏就更重要。\n\n那一年我也更能接受低效率。环境变化带来的影响是真实存在的，不能假装自己每天都能稳定输出。状态不好的时候，完成一点基础维护也算是前进。\n\n疫情时期的远程学习让我学到一个朴素道理：真正能长期坚持的安排，必须足够现实。它不是完美计划，而是在混乱生活里还能继续执行的一套小方法。只要每天还有一点清楚的推进，人就不至于完全被不确定感带走。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2020-remote-work-transform&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;2020：远程办公如何重构技术工作栈&quot;],&quot;description&quot;:[0,&quot;新冠疫情在 2020 年迫使全球技术公司转向远程办公。这不只是暂时的应对，更是一次对协作工具、工程文化和基础设施的长期重塑。&quot;],&quot;date&quot;:[3,&quot;2020-12-28T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;https://placehold.co/800x400/152035/01AD9F?text=Remote+Work+2020&quot;],&quot;categories&quot;:[1,[[0,&quot;技术观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2020&quot;],[0,&quot;远程办公&quot;],[0,&quot;协作工具&quot;],[0,&quot;工程文化&quot;],[0,&quot;Zoom&quot;]]],&quot;sourceType&quot;:[0,&quot;资料整理&quot;],&quot;sources&quot;:[1,[[0,{&quot;title&quot;:[0,&quot;How COVID-19 Changed Tech Spending&quot;],&quot;url&quot;:[0,&quot;https://www.gartner.com/en/newsroom/press-releases/2020-04-01-gartner-covid-19&quot;],&quot;publisher&quot;:[0,&quot;Gartner&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;GitHub Octoverse 2020&quot;],&quot;url&quot;:[0,&quot;https://octoverse.github.com/2020/&quot;],&quot;publisher&quot;:[0,&quot;GitHub&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}],[0,{&quot;title&quot;:[0,&quot;2020 State of Remote Work&quot;],&quot;url&quot;:[0,&quot;https://buffer.com/state-of-remote-work/2020&quot;],&quot;publisher&quot;:[0,&quot;Buffer&quot;],&quot;accessed&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;]}]]]}],&quot;content&quot;:[0,&quot;2020 年，新冠疫情迫使全球范围内的科技公司紧急切换到远程办公模式。这可能是历史上最大规模的工作方式变迁实验。\n\n## 工具栈的爆发增长\n\n2020 年见证了几类工具的快速增长：\n\n- **视频会议**：Zoom 的日活跃用户从 2019 年底的约 1000 万增长到 2020 年中的 3 亿。Teams、Google Meet 同步增长\n- **协作平台**：Notion、Figma、Miro 成为远程团队的标准配置\n- **异步沟通**：Slack 消息量激增，Loom 等异步视频工具获得关注\n- **基础设施**：VPN 容量紧急扩容，零信任架构讨论增多，SaaS 工具年支出普遍增长 30-50%\n\nGitHub Octoverse 2020 报告显示，开源贡献活动在这一年不降反升，开发者的生产力在远程模式下保持了令人意外的稳定。\n\n## 工程文化的深层变化\n\n远程办公不只是\&quot;在家写代码\&quot;，它触发了更深层的工程文化变化：\n\n- 文档和异步沟通的重要性被重新评估：口头沟通减少后，书面表达成为主要协作载体\n- 招聘的地域限制被打破：硅谷公司开始全球招聘，工程师也可以不再聚居于湾区\n- 工作时间的弹性化：同步和异步的混合模式引发了新的管理实践\n\n**观点判断：** 2020 年的远程切换是强制性的，但它的长期影响超越了疫情本身。工具栈的成熟让分布式团队成为可行的默认选项，这个趋势不会随着疫情结束而逆转。对工程师来说，这意味着竞争从\&quot;本地市场\&quot;扩展到了\&quot;全球市场\&quot;，同时也意味着工作地点的自由度大幅提升。\n\n## 小结\n\n2020 年技术行业最重要的改变可能不是某项新技术，而是工作方式的系统性重构。远程办公工具栈的成熟、沟通模式的书面化和招聘的去地域化，都是长期信号。疫情只是触发器，分布式协作的工程基础在 2020 年被夯实了。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2020-room-workstation&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;把房间变成工作站：一个人的生产力系统&quot;],&quot;description&quot;:[0,&quot;整理桌面、设备和习惯，把房间变成更稳定的学习工作空间。&quot;],&quot;date&quot;:[3,&quot;2020-12-06T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2020-room-workstation.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;生活随笔&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2020&quot;],[0,&quot;工作站&quot;],[0,&quot;效率工具&quot;],[0,&quot;生活方式&quot;]]],&quot;category&quot;:[0,&quot;生活随笔&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2020 年底，我开始认真整理自己的房间和桌面。不是为了拍照好看，而是因为每天都在同一个空间里学习和工作，环境稍微乱一点，心也会跟着乱。\n\n![房间工作站](/images/posts/personal-growth/2020-room-workstation.jpg)\n\n最开始只是把桌面清空。没用的线收起来，常用的东西固定位置，电脑旁边留出写字的地方。以前找一个转接头要翻半天，现在至少知道它应该在哪里。这个变化很小，但每天都会用到。\n\n后来我又调整了显示器高度、键盘位置和灯光。以前长时间低头，脖子很容易酸。换了支架以后，虽然不是立刻变成什么高效人士，但坐着写东西确实舒服了一些。舒适不是奢侈，它会影响一个人能不能稳定做事。\n\n软件上我也做了整理。常用文件放在固定目录，笔记按年份和主题分类，浏览器书签减少到真正需要的几个。以前总觉得工具越多越专业，后来发现工具太多只会增加选择成本。\n\n这个“生产力系统”听起来很大，其实就是一些很普通的安排。桌面少一点杂物，文件少一点乱放，任务少一点同时开始。它不能替我完成学习，也不能自动解决拖延，但能减少很多无谓消耗。\n\n把房间变成工作站以后，我最大的感受是稳定。人不可能每天都有很强的动力，但一个顺手的环境可以让开始变得容易一点。很多长期坚持，靠的不是热情一直很高，而是把阻力一点点降下来。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2021-from-runs-to-readable&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;从“能跑就行”到“写得清楚”&quot;],&quot;description&quot;:[0,&quot;从追求功能跑通，到开始重视命名、结构和维护成本。&quot;],&quot;date&quot;:[3,&quot;2021-10-31T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2021-from-runs-to-readable.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2021&quot;],[0,&quot;代码质量&quot;],[0,&quot;可读性&quot;],[0,&quot;工程习惯&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;以前写代码，最大目标就是让它跑起来。只要页面能显示，按钮能点，数据能出来，就觉得任务完成了。后来项目稍微大一点，我才发现“能跑”只是很低的要求。真正麻烦的是过几天回来，自己都看不懂当时为什么这么写。\n\n![写得清楚](/images/posts/personal-growth/2021-from-runs-to-readable.jpg)\n\n2021 年我开始更在意代码可读性。变量名能不能说明用途，函数是不是做了太多事，文件结构有没有让人一眼看懂大概关系。这些事情以前觉得是细节，后来才知道它们直接影响维护成本。\n\n最明显的变化是我开始愿意删代码。过去总怕删掉以后用得上，于是项目里留下很多废弃逻辑。时间一长，这些东西会干扰判断。后来我慢慢接受，删掉不用的代码也是一种进度。干净的项目会让人更愿意继续维护。\n\n我也学着写更少但更有用的注释。不是解释每一行做了什么，而是在复杂逻辑前说明为什么这样处理。代码本身应该尽量清楚，注释负责补充背景和决策。\n\n这个转变没有一夜完成。很多时候为了赶进度，我还是会写出临时方案。但至少现在我知道哪些地方是临时的，知道之后应该回来整理，而不是假装它已经很好。\n\n从“能跑就行”到“写得清楚”，其实是从短期结果走向长期维护。代码是写给机器执行的，也是写给人看的。这个人可能是别人，也很可能是几个月后的自己。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2021-react-component-thinking&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;React 初体验：组件化思维如何改变我&quot;],&quot;description&quot;:[0,&quot;第一次系统使用 React 后，对页面结构和状态管理的理解。&quot;],&quot;date&quot;:[3,&quot;2021-05-16T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2021-react-component-thinking.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2021&quot;],[0,&quot;React&quot;],[0,&quot;组件化&quot;],[0,&quot;前端&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;刚开始接触 React 的时候，我最不适应的是它把页面拆成很多组件。以前写页面，HTML、CSS、JavaScript 分开看，哪里需要效果就去哪里补一点。React 让这些东西围绕组件组织起来，一开始反而让我觉得麻烦。\n\n![React 组件](/images/posts/personal-growth/2021-react-component-thinking.jpg)\n\n真正写了一段时间以后，我才慢慢理解组件化的好处。一个按钮不只是一个标签，它有状态，有样式，有点击后的行为。一个列表也不只是一堆重复结构，它可以接收数据，然后按同一种方式展示。页面被拆开以后，每一块都更容易理解。\n\nReact 也让我重新看待数据流。以前我经常直接改页面，哪里显示不对就去操作哪里。React 更强调由状态驱动界面：数据变了，界面自然跟着变。这个想法刚开始有点绕，但熟悉以后会发现它让很多逻辑变得更清楚。\n\n当然，学习过程也没那么顺。props 和 state 的边界、组件拆分的粒度、什么时候该抽函数，什么时候只是过度设计，这些都需要在实际项目里慢慢摸索。我也写过很多不必要的组件，把简单问题弄复杂。\n\n2021 年的 React 学习给我最大的影响，不是掌握了某个框架，而是改变了我看页面的方式。以前看到的是一个整体页面，现在会先想它由哪些部分组成，哪些数据会变化，哪些东西应该复用。\n\n这种思维后来不只用在 React 里。做其他项目时，我也会自然地把复杂问题拆成小块。组件化本质上是一种整理能力：把混在一起的东西分开，让每一部分都有清楚的责任。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2022-refactor-old-project&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;重构旧项目：和过去的自己对话&quot;],&quot;description&quot;:[0,&quot;一次重构旧项目的经历，以及从旧代码里看到的成长。&quot;],&quot;date&quot;:[3,&quot;2022-08-27T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2022-refactor-old-project.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;项目复盘&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;重构&quot;],[0,&quot;项目复盘&quot;],[0,&quot;代码质量&quot;]]],&quot;category&quot;:[0,&quot;项目复盘&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2022 年我翻出了一个旧项目，原本只是想改一个小功能，结果打开以后发现很多地方都看不懂了。文件命名随意，逻辑分散，样式覆盖来覆盖去，改一处就担心影响另一处。\n\n![重构旧项目](/images/posts/personal-growth/2022-refactor-old-project.jpg)\n\n刚开始我有点想笑，也有点尴尬。那些代码确实是自己写的，只是当时觉得已经够好了。现在看起来问题很多，但它也真实记录了那个阶段的水平。重构旧项目，某种程度上就是和过去的自己对话。\n\n我没有一上来就全部推翻。先把能跑的部分保住，再从最混乱的文件开始整理。重复逻辑抽出来，没用的代码删掉，命名改得更明确。每改一块就跑一下，确认功能没有坏。\n\n这个过程让我意识到，重构不是为了追求“漂亮”，而是为了降低继续修改的成本。旧项目之所以让人害怕，是因为不知道哪里会出问题。整理以后，项目不一定更炫，但人敢动它了。\n\n重构也让我更能理解当年的自己。很多现在看起来不合理的写法，当时可能是因为时间不够，也可能是因为还不知道更好的方法。成长不是否定过去，而是能看见过去的局限，然后温和地把它修好。\n\n这次重构以后，我对新项目更谨慎了一点。不是一开始就写得完美，而是尽量少留下明显会伤到未来自己的坑。代码最终都会变旧，区别只在于它旧了以后还能不能被继续理解。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2022-typescript-sense-of-safety&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;TypeScript 带来的安全感&quot;],&quot;description&quot;:[0,&quot;记录从 JavaScript 过渡到 TypeScript 时，对类型和协作的理解。&quot;],&quot;date&quot;:[3,&quot;2022-03-09T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2022-typescript-sense-of-safety.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;TypeScript&quot;],[0,&quot;前端&quot;],[0,&quot;工程化&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;第一次用 TypeScript 时，我其实有点抗拒。原本 JavaScript 写起来很自由，突然多了类型，很多地方都要先说明清楚。明明功能还没写完，编辑器已经开始报红，看起来像是给自己增加麻烦。\n\n![TypeScript 安全感](/images/posts/personal-growth/2022-typescript-sense-of-safety.jpg)\n\n用了一段时间以后，我慢慢理解了它的价值。类型不是为了限制人，而是为了把一些错误提前暴露出来。一个函数需要什么参数，返回什么结果，数据结构里有哪些字段，这些以前都要靠记忆和文档，现在在代码里就能看到。\n\n最明显的体验是重构时更安心。以前改一个字段名，心里总没底，不知道哪里还在使用。TypeScript 会把很多遗漏的位置标出来。虽然不可能发现所有问题，但它给了一个很实在的安全网。\n\n它也让我更认真地设计数据结构。以前拿到接口数据就直接用，缺什么字段运行时才发现。现在会先想这个对象到底长什么样，哪些字段必须存在，哪些可能为空。这个过程让代码从一开始就更清楚。\n\n当然，TypeScript 也会带来新的复杂度。类型写得太绕，会让代码变得难读。为了追求完美类型而消耗太多时间，也不一定划算。后来我给自己的原则是：类型要帮助理解和维护，不要变成炫技。\n\n2022 年学习 TypeScript，让我感受到工程工具的真正意义。它不是让代码看起来更高级，而是在项目变复杂时，帮人少犯一些低级错误，也让协作和修改变得更稳。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2023-ai-tools-daily-learning&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;AI 工具进入日常：我如何重新安排学习方式&quot;],&quot;description&quot;:[0,&quot;AI 工具进入日常后，学习方式从搜索答案变成对话和验证。&quot;],&quot;date&quot;:[3,&quot;2023-02-19T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2023-ai-tools-daily-learning.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;AI 时代观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2023&quot;],[0,&quot;AI&quot;],[0,&quot;学习方法&quot;],[0,&quot;工具&quot;]]],&quot;category&quot;:[0,&quot;AI 时代观察&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2023 年 AI 工具真正进入了我的日常。刚开始我把它当作更聪明的搜索框，遇到问题就问一句，希望它直接给答案。用了一段时间以后才发现，真正有用的不是省掉思考，而是改变了思考的顺序。\n\n![AI 进入日常](/images/posts/personal-growth/2023-ai-tools-daily-learning.jpg)\n\n以前学习一个新概念，我通常先搜文章，再看视频，最后自己整理。现在我会先让 AI 帮我搭一个大概框架，知道有哪些关键点，再去查文档和例子。这样做的好处是不会一开始就迷路，坏处是如果不验证，很容易被看起来顺畅的解释带偏。\n\n所以我给自己定了一个原则：AI 可以帮我起步，但不能替我确认事实。涉及具体版本、命令、API、报错原因时，还是要回到官方文档、源码或实际运行结果。它说得越肯定，我越需要保留一点怀疑。\n\nAI 对学习最大的帮助，是降低了提问成本。很多以前不好意思问、也不知道怎么搜的问题，现在可以先用自然语言描述出来。哪怕它的回答不完全对，也能帮我把问题变得更清楚。\n\n但我也发现，太依赖 AI 会让人变懒。遇到问题不愿意自己读报错，不愿意翻文档，只想立刻得到解释。这样短期很快，长期会削弱判断力。\n\n2023 年我对 AI 工具的态度逐渐稳定下来：把它当作学习伙伴，而不是答案机器。它适合帮我梳理、比较、生成初稿，也适合陪我排查思路。但最后要不要相信，怎么落地，仍然需要自己负责。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2023-personal-site-redesign&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;一次个人网站改版记录&quot;],&quot;description&quot;:[0,&quot;记录一次个人网站改版中关于内容、结构和视觉的取舍。&quot;],&quot;date&quot;:[3,&quot;2023-11-12T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2023-personal-site-redesign.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;项目复盘&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2023&quot;],[0,&quot;个人网站&quot;],[0,&quot;改版&quot;],[0,&quot;项目复盘&quot;]]],&quot;category&quot;:[0,&quot;项目复盘&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2023 年我给个人网站做了一次改版。起因不是技术升级，而是我发现旧页面越来越不像现在的自己。内容分类有点乱，首页重点不清楚，一些早期写下的介绍也显得不太准确。\n\n![个人网站改版](/images/posts/personal-growth/2023-personal-site-redesign.jpg)\n\n改版前我先做了一件事：把现有内容重新看了一遍。哪些文章还值得保留，哪些只是临时记录，哪些页面已经没人需要。这个过程比写代码更花时间，因为它涉及取舍。删掉一个旧页面，有时像是在删掉一段旧想法。\n\n视觉上我没有追求很复杂的效果。以前总想让页面看起来“厉害”，加很多装饰和动效。后来发现个人网站最重要的是让人快速知道你是谁、写过什么、做过什么。清楚比热闹重要。\n\n技术上也遇到一些小问题。旧组件之间耦合比较多，改一个列表样式会影响其他页面。于是我顺手做了一些拆分，把文章列表、标签、导航这些部分整理得更明确。\n\n这次改版让我意识到，个人网站不是一次性作品。它更像一个长期维护的房间，过一段时间就需要整理。人的关注点会变，作品会增加，旧内容也需要重新摆放。\n\n改完以后，网站并没有变得多么惊艳，但我更愿意打开它了。对个人项目来说，这一点很重要。一个自己都不想维护的项目，很难长久。改版的意义，就是让它重新贴近现在的生活和表达。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2024-code-to-product-ux&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;从代码到产品：我开始关注用户体验&quot;],&quot;description&quot;:[0,&quot;从只关心功能实现，到开始关注用户路径、反馈和细节。&quot;],&quot;date&quot;:[3,&quot;2024-04-07T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2024-code-to-product-ux.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;技术成长&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2024&quot;],[0,&quot;用户体验&quot;],[0,&quot;产品思维&quot;],[0,&quot;前端&quot;]]],&quot;category&quot;:[0,&quot;技术成长&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;以前做项目，我最关心的是功能有没有实现。接口通了，按钮能点，数据能显示，就觉得差不多了。2024 年我开始更明显地意识到，功能只是产品的一部分，用户真正接触到的是整个体验。\n\n![从代码到产品](/images/posts/personal-growth/2024-code-to-product-ux.jpg)\n\n一个页面能不能用，不只看代码是否正确。入口是否明显，按钮文字是否清楚，加载时有没有反馈，出错后用户知不知道该怎么办，这些细节都会影响使用感受。以前我觉得它们是设计师才需要关心的事，后来发现前端开发也绕不开。\n\n有一次做表单，我只考虑字段能不能提交，后来自己从头填了一遍才发现很别扭。有些提示来得太晚，有些错误信息太生硬，有些默认值根本不符合实际使用场景。代码没有错，但体验不好。\n\n从那以后，我开始习惯用用户路径来检查功能。不是只看某个组件，而是从用户进入页面开始，一步一步走到完成任务。这个过程很容易暴露问题：哪里需要等待，哪里会犹豫，哪里缺少确认。\n\n关注用户体验以后，我写代码的重点也变了。以前更在意实现方式，现在会同时考虑状态、反馈和边界。空数据怎么展示，慢网络怎么处理，手机屏幕上是否好点，这些都变成开发的一部分。\n\n从代码到产品，是一个视角变化。代码回答“能不能做”，产品还要回答“有没有用、好不好用、别人愿不愿意继续用”。这个问题更难，但也让技术变得更贴近真实生活。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2024-prompt-search-judgment&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Prompt、搜索与判断力：新时代的信息素养&quot;],&quot;description&quot;:[0,&quot;AI 和搜索同时存在时，真正重要的是提问、验证和判断。&quot;],&quot;date&quot;:[3,&quot;2024-09-15T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2024-prompt-search-judgment.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;AI 时代观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2024&quot;],[0,&quot;AI&quot;],[0,&quot;Prompt&quot;],[0,&quot;信息素养&quot;]]],&quot;category&quot;:[0,&quot;AI 时代观察&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2024 年我越来越感觉到，信息能力正在发生变化。过去我们常说要会搜索，知道关键词怎么写，知道结果怎么筛。现在多了 AI，问题不再只是“搜得到吗”，还包括“问得清楚吗”和“判断得出来吗”。\n\n![判断力](/images/posts/personal-growth/2024-prompt-search-judgment.jpg)\n\nPrompt 这个词听起来有点新，但本质上还是表达问题。你给的信息越清楚，目标越明确，得到的回答通常越有用。反过来，如果自己都没想明白要什么，AI 往往会给出一个看似完整但不一定有帮助的答案。\n\n搜索和 AI 各有位置。搜索适合找事实、来源、文档和具体网页。AI 适合帮人整理结构、比较方案、生成初稿和解释概念。问题在于，很多时候我们会把它们混在一起，希望一个工具完成所有事。\n\n我给自己的做法是：先用 AI 梳理问题，再用搜索确认事实；先看官方资料，再看别人的经验；遇到重要结论时，尽量找到原始来源。这个流程不快，但能减少很多误判。\n\n判断力在这里变得特别重要。一个回答有没有引用可靠来源，是否和常识冲突，是否忽略了时间和版本，是否把推测说成事实，这些都需要自己去看。工具越强，人越不能完全放弃判断。\n\n新时代的信息素养，不只是会用新工具。它包括提问能力、验证习惯、来源意识和承认不确定的勇气。技术会继续变化，但这些基础能力会一直有用。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2025-ai-coding-assistant-changed&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;AI 编程助手改变了什么，又没有改变什么&quot;],&quot;description&quot;:[0,&quot;观察 AI 编程助手对开发流程的影响，以及仍然需要人的判断。&quot;],&quot;date&quot;:[3,&quot;2025-01-26T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2025-ai-coding-assistant-changed.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;AI 时代观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2025&quot;],[0,&quot;AI 编程&quot;],[0,&quot;开发工具&quot;],[0,&quot;工程判断&quot;]]],&quot;category&quot;:[0,&quot;AI 时代观察&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;到 2025 年，AI 编程助手已经不再新鲜。它能补全代码，解释报错，生成测试，甚至帮忙改一段不小的功能。刚开始用的时候很兴奋，觉得很多重复劳动终于可以少做一些。\n\n![AI 编程助手](/images/posts/personal-growth/2025-ai-coding-assistant-changed.jpg)\n\n它确实改变了开发节奏。写样板代码更快了，查 API 的时间少了一些，遇到陌生代码时也能先让它帮忙解释一遍。尤其在个人项目里，它像一个随时可以讨论的同伴，能帮我把模糊想法变成一个可运行的初稿。\n\n但用得越多，我越清楚它没有改变最核心的责任。代码最后是不是正确，边界有没有处理，安全性有没有问题，性能是否能接受，仍然需要开发者判断。AI 可以写出看起来很完整的代码，也可能在细节上犯很隐蔽的错。\n\n它也没有替代需求理解。很多问题不是“怎么写代码”，而是“到底要解决什么”。如果目标不清楚，AI 只会更快地产出一堆可能不需要的东西。速度变快以后，做错方向的成本反而可能更高。\n\n我现在更愿意把 AI 编程助手放在两个位置：一个是加速器，帮我处理重复和初稿；另一个是讨论对象，帮我从不同角度检查思路。至于最后的取舍，还是要自己来。\n\nAI 改变了写代码的手感，却没有改变工程的底层要求。清楚的需求、可靠的测试、可维护的结构、谨慎的发布，这些旧规则仍然有效。工具在变，人要承担的判断没有消失。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2025-static-blog-longevity&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;静态博客的生命力：轻量、自由与可持续&quot;],&quot;description&quot;:[0,&quot;重新理解静态博客的价值：简单、可控、适合长期维护。&quot;],&quot;date&quot;:[3,&quot;2025-07-20T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2025-static-blog-longevity.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;项目复盘&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2025&quot;],[0,&quot;静态博客&quot;],[0,&quot;个人网站&quot;],[0,&quot;长期维护&quot;]]],&quot;category&quot;:[0,&quot;项目复盘&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;用了几年个人博客以后，我越来越喜欢静态博客这种形式。它不复杂，没有太多后台和权限系统，也不需要为了一个简单页面维护一整套服务。文章写成文件，项目构建以后发布，流程很朴素。\n\n![静态博客](/images/posts/personal-growth/2025-static-blog-longevity.jpg)\n\n静态博客最大的优点是轻。轻不是功能少，而是负担小。它不会因为数据库迁移而突然打不开，也不需要频繁处理后台安全问题。对于个人记录来说，这种稳定感很重要。\n\n另一个好处是自由。文章、样式、目录、部署方式都在自己手里。想改版可以改，想迁移也比较容易。内容不是被锁在某个平台里，而是以文件的形式保存下来。时间久了，这种可控感会越来越珍贵。\n\n当然，静态博客也有局限。评论、搜索、后台编辑、多作者协作，这些功能要么需要额外服务，要么实现起来不如成熟平台方便。但对我来说，博客的核心仍然是写作和整理，其他功能可以慢慢加。\n\n2025 年我重新看待博客时，发现它更像一个长期容器。它记录技术学习，也记录生活变化。每次回头看旧文章，都能看到自己当时关心什么、理解到哪里。\n\n静态博客的生命力，可能正来自它的克制。它不急着把所有功能塞进来，也不强迫人按照平台规则表达。只要还能写，还能发布，它就会安静地陪着一个人往前走。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2026-coding-with-ai-habits&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;和 AI 一起写代码：新的协作习惯&quot;],&quot;description&quot;:[0,&quot;在 AI 编程更常见之后，整理一套更稳的协作习惯。&quot;],&quot;date&quot;:[3,&quot;2026-05-01T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2026-coding-with-ai-habits.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;AI 时代观察&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2026&quot;],[0,&quot;AI 编程&quot;],[0,&quot;协作&quot;],[0,&quot;开发习惯&quot;]]],&quot;category&quot;:[0,&quot;AI 时代观察&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;到 2026 年，和 AI 一起写代码已经变成一件很自然的事。它不再只是偶尔问问题的工具，而是会参与到需求梳理、代码修改、测试和复盘里。习惯改变以后，我也开始重新调整自己的工作方式。\n\n![AI 协作习惯](/images/posts/personal-growth/2026-coding-with-ai-habits.jpg)\n\n第一件事，是把任务说清楚。以前自己写代码时，很多想法只在脑子里。现在要和 AI 协作，就必须把目标、限制、已有上下文讲明白。这个过程本身就很有价值，因为表达清楚以后，问题通常也会清楚很多。\n\n第二件事，是分阶段检查结果。让 AI 一次性完成很大改动，看起来省事，实际风险不小。我更喜欢先让它理解项目，再做小范围修改，最后跑测试和看差异。每一步都确认一下，出问题时也更容易定位。\n\n第三件事，是保留自己的判断。AI 有时会给出很顺的方案，但不一定符合项目风格，也不一定考虑到长期维护。这个时候不能只看代码能不能跑，还要看它是不是和现有结构一致，别人以后能不能读懂。\n\nAI 协作也让我更重视测试。以前有些小改动靠手动点一点就算了，现在代码生成速度快了，验证就更不能省。测试不是形式，而是防止快速修改带来隐蔽问题的底线。\n\n和 AI 一起写代码，新的习惯不是把所有工作交出去，而是学会更清楚地描述、更谨慎地检查、更稳定地迭代。工具越来越强，但真正可靠的协作，仍然建立在清楚和负责之上。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;2026-digital-garden-reset&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;重新整理我的数字花园&quot;],&quot;description&quot;:[0,&quot;整理博客、笔记和项目资料，让它们重新形成可维护的个人知识系统。&quot;],&quot;date&quot;:[3,&quot;2026-02-14T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/images/posts/personal-growth/2026-digital-garden-reset.jpg&quot;],&quot;categories&quot;:[1,[[0,&quot;生活随笔&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;2026&quot;],[0,&quot;数字花园&quot;],[0,&quot;知识管理&quot;],[0,&quot;生活记录&quot;]]],&quot;category&quot;:[0,&quot;生活随笔&quot;],&quot;updated&quot;:[3,&quot;2026-05-12T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;2026 年初，我开始重新整理自己的数字内容。博客文章、项目记录、学习笔记、临时想法，几年下来散在很多地方。有些内容重复，有些已经过时，有些明明很有价值，却被埋在很深的文件夹里。\n\n![数字花园](/images/posts/personal-growth/2026-digital-garden-reset.jpg)\n\n我以前很喜欢“数字花园”这个说法，因为它不像知识库那么严肃。花园里的东西可以生长，可以修剪，也可以有暂时不完整的角落。它不要求每篇笔记一开始就完美，更强调持续整理。\n\n这次整理不是简单分类，而是重新思考每类内容的用途。博客适合放相对完整的文章，笔记适合保留还在发展的想法，项目文档则记录具体决策和实现细节。位置清楚以后，内容才更容易继续生长。\n\n我也删掉了一些东西。以前总觉得所有记录都应该留下，但实际上过期的资料太多，会让真正有用的内容变难找。删除不是否定过去，而是给现在腾出空间。\n\n整理过程中，我重新读了一些旧文章。很多表达很稚嫩，但很真实。它们提醒我，成长不是突然发生的，而是在一次次记录、修改和回看中慢慢积累。\n\n重新整理数字花园以后，我没有得到一个完美系统，只是得到一个更愿意维护的系统。这就够了。工具和目录都可以继续调整，重要的是让内容重新流动起来，而不是安静地堆在那里。&quot;]}],[0,{&quot;slug&quot;:[0,&quot;foreword&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;前言&quot;],&quot;description&quot;:[0,&quot;搭建此博客的目的在于记录生活点滴以及一些在自己看了来有意义的事情。同时自我激励，保持不断学习的习惯。路还很长。&quot;],&quot;date&quot;:[3,&quot;2019-05-14T00:00:00.000Z&quot;],&quot;categories&quot;:[1,[[0,&quot;others&quot;]]],&quot;authors&quot;:[1,[[0,&quot;Encli&quot;]]],&quot;tags&quot;:[1,[[0,&quot;随笔&quot;]]],&quot;category&quot;:[0,&quot;日志&quot;],&quot;updated&quot;:[3,&quot;2019-05-18T00:00:00.000Z&quot;],&quot;sourceType&quot;:[0,&quot;原创&quot;],&quot;sources&quot;:[1,[]]}],&quot;content&quot;:[0,&quot;搭建此博客的目的在于记录生活点滴以及一些在自己看了来有意义的事情。同时自我激励，保持不断学习的习惯。\n\n路还很长。&quot;]}]]]}" ssr client="load" opts="{&quot;name&quot;:&quot;SearchBar&quot;,&quot;value&quot;:true}" await-children><div class="min-h-[45vh]"><input class="form-input w-full text-center" placeholder="Type here to Search posts" type="text" autoComplete="off" autofocus="" name="search" value=""/><div class="row"></div></div><!--astro:end--></astro-island> </div> </section>  </main> <footer class="section bg-dark"> <div class="container text-center">  <ul class="mb-8 space-x-4"> <li class="inline-block"> <a href="/blog" class="p-4 text-white/75 hover:text-white transition-all"> 文章 </a> </li><li class="inline-block"> <a href="/briefs" class="p-4 text-white/75 hover:text-white transition-all"> 简报 </a> </li><li class="inline-block"> <a href="/timeline" class="p-4 text-white/75 hover:text-white transition-all"> 时间线 </a> </li><li class="inline-block"> <a href="/about" class="p-4 text-white/75 hover:text-white transition-all"> 关于 </a> </li> </ul>  <ul class="social-icons mb-8"> <li> <a aria-label="github" href="https://github.com/Encli2046" target="_blank" rel="noopener noreferrer nofollow"> <span class="sr-only">github</span> <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 496 512" class="inline-block" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.
